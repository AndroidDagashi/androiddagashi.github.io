name: Update Json files
on:
  workflow_dispatch:
  schedule:
    # Every 2 hours on even JST hours (includes 20:xx).
    # Minute 17 avoids the top of the hour, when GitHub delays or drops scheduled runs under load.
    - cron: '17 0-22/2 * * *'
      timezone: 'Asia/Tokyo'

jobs:
  push_json_and_rssfeed:
    name: Update Json files
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUSH_ACCESS_TOKEN: ${{ secrets.PUSH_ACCESS_TOKEN }}
      GH_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_USER_NAME: AndroidDagashi
      PROJECT_REPO_NAME: androiddagashi.github.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: install dependencies
        run: |
          node --version
          yarn install

      - name: Setup git config
        run: sh ./.github/setup-git-config.sh

      - name: Generate json resources
        run: yarn api:generate

      - name: Generate RSS feed
        run: yarn rss:generate

      - name: Push generated files if there's any update
        run: sh ./.github/push-resources-if-updated.sh

      - name: Print debug info
        if: failure()
        run: |
          git remote
          git status
